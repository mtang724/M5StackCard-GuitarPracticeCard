; Guitar Practice Card — M5Stack Cardputer (ESP32-S3 / StampS3)
; Build:   .piovenv/bin/pio run
; Flash:   .piovenv/bin/pio run -t upload
; Monitor: .piovenv/bin/pio device monitor
;
; The compiled app image is at: .pio/build/cardputer/firmware.bin
; That .bin is what you install/boot from bmorcelli/Launcher (SD, WebUI, or USB).

[env:cardputer]
platform = espressif32
board = m5stack-stamps3          ; Cardputer uses the StampS3 module (ESP32-S3, 8MB flash)
framework = arduino
board_build.flash_size = 8MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    m5stack/M5Cardputer          ; pulls in M5Unified + M5GFX (display, keyboard, speaker, mic)

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1  ; serial-over-USB so `pio device monitor` works
