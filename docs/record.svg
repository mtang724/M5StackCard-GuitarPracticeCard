    <line x1="20" y1="106" x2="220" y2="106" stroke="#4a4a4a"/>
    <circle cx="20"  cy="104" r="2" fill="#00FF00"/>
    <circle cx="53"  cy="108" r="2" fill="#00FF00"/>
    <circle cx="86"  cy="103" r="2" fill="#00FF00"/>
    <circle cx="120" cy="107" r="2" fill="#00FF00"/>
    <circle cx="153" cy="105" r="2" fill="#00FF00"/>
    <circle cx="186" cy="109" r="2" fill="#FFA600"/>
    <circle cx="220" cy="104" r="2" fill="#00FF00"/>
    <text x="4" y="132" font-size="8" fill="#7a7a7a">SPACE retry  `:back</text>
  </g>
  <rect width="240" height="135" rx="6" fill="none" stroke="#333"/>
</svg>
