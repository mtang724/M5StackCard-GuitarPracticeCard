<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" width="480" height="270" font-family="Helvetica, Arial, sans-serif">
  <defs><clipPath id="s"><rect width="240" height="135" rx="6"/></clipPath></defs>
  <g clip-path="url(#s)">
    <rect width="240" height="135" fill="#000"/>
    <rect width="240" height="20" fill="#FFA600"/>
    <text x="6" y="14" font-size="12" font-weight="bold" fill="#000">Result</text>
    <text x="120" y="52" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">98</text>
    <text x="120" y="70" font-size="10" fill="#7a7a7a" text-anchor="middle">your BPM  (target 100, -2 drag)</text>
